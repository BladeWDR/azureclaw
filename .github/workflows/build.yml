name: Build Azureclaw Router Images

on:
  schedule:
    # Automated weekly build at 02:00 UTC every Tuesday
    # Pulls fresh upstream Fedora updates, kernel patches, and security fixes
    - cron: '0 2 * * 2'
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      build_baremetal_iso:
        description: 'Build Baremetal Installer ISO'
        type: boolean
        default: true
      build_vm_qcow2:
        description: 'Build Proxmox / KVM QCOW2 Image'
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-container:
    name: Build & Push bootc Container Image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Lowercase image repository name
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,format=short,prefix=sha-
            type=ref,event=tag

      - name: Build and push container image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Containerfile
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-qcow2:
    name: Build Proxmox / KVM QCOW2
    needs: build-container
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_vm_qcow2 }}
    # Pinned to ubuntu-22.04 to avoid upstream osbuild issue #2579 (MountGuard MS_PRIVATE + MS_REMOUNT on kernel 7.0+)
    # Track https://github.com/osbuild/osbuild/issues/2579 before returning to ubuntu-latest
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Lowercase image repository name & resolve target tag
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "TARGET_TAG=latest" >> $GITHUB_ENV
          else
            SAFE_TAG=$(echo "${{ github.ref_name }}" | tr '/' '-')
            echo "TARGET_TAG=${SAFE_TAG}" >> $GITHUB_ENV
          fi

      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell
          df -h

      - name: Set up QEMU tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-utils zstd

      - name: Pull image into Podman storage
        run: |
          mkdir -p output/artifacts
          sudo mkdir -p /var/lib/containers/storage
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
          echo "==> Pulling target image into host container storage..."
          sudo podman pull "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TARGET_TAG }}"

      - name: Generate QCOW2 image with bootc-image-builder
        run: |
          mkdir -p output/qcow2_build
          sudo podman run \
            --privileged \
            --security-opt label=type:unconfined_t \
            --security-opt apparmor=unconfined \
            -v /dev:/dev \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v "$(pwd)/output/qcow2_build":/output \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type qcow2 \
            --target-arch x86_64 \
            --local \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TARGET_TAG }}" || [ -f "$(pwd)/output/qcow2_build/qcow2/disk.qcow2" ]

          sudo chown -R "$(id -u):$(id -g)" output/qcow2_build

          echo "==> Fast compressing QCOW2 with zstd..."
          zstd -6 -T0 "$(pwd)/output/qcow2_build/qcow2/disk.qcow2" \
            -o "output/artifacts/azureclaw-proxmox-kvm-${{ github.sha }}.qcow2.zst"

          cd output/artifacts
          sha256sum * > SHA256SUMS

      - name: Upload QCOW2 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: azureclaw-qcow2-${{ github.sha }}
          path: output/artifacts/*
          retention-days: 14

      - name: Publish to GitHub Release on Version Tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output/artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-iso:
    name: Build Baremetal Installer ISO
    needs: build-container
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_baremetal_iso }}
    # Pinned to ubuntu-22.04 to avoid upstream osbuild issue #2579 (MountGuard MS_PRIVATE + MS_REMOUNT on kernel 7.0+)
    # Track https://github.com/osbuild/osbuild/issues/2579 before returning to ubuntu-latest
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Lowercase image repository name & resolve target tag
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "TARGET_TAG=latest" >> $GITHUB_ENV
          else
            SAFE_TAG=$(echo "${{ github.ref_name }}" | tr '/' '-')
            echo "TARGET_TAG=${SAFE_TAG}" >> $GITHUB_ENV
          fi

      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell
          df -h

      - name: Pull image into Podman storage
        run: |
          mkdir -p output/artifacts
          sudo mkdir -p /var/lib/containers/storage
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
          echo "==> Pulling target image into host container storage..."
          sudo podman pull "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TARGET_TAG }}"

      - name: Generate Baremetal ISO installer with bootc-image-builder
        run: |
          mkdir -p output/iso_build
          sudo podman run \
            --privileged \
            --security-opt label=type:unconfined_t \
            --security-opt apparmor=unconfined \
            -v /dev:/dev \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v "$(pwd)/output/iso_build":/output \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type anaconda-iso \
            --target-arch x86_64 \
            --local \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TARGET_TAG }}" || [ -f "$(pwd)/output/iso_build/bootiso/install.iso" ]

          sudo chown -R "$(id -u):$(id -g)" output/iso_build

          mv "$(pwd)/output/iso_build/bootiso/install.iso" \
            "output/artifacts/azureclaw-baremetal-installer-${{ github.sha }}.iso"

          cd output/artifacts
          sha256sum * > SHA256SUMS

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: azureclaw-iso-${{ github.sha }}
          path: output/artifacts/*
          retention-days: 14

      - name: Publish to GitHub Release on Version Tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output/artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
