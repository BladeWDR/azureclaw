name: Build Azureclaw Router Images

on:
  schedule:
    # Automated weekly build at 02:00 UTC every Tuesday
    # Pulls fresh upstream Fedora updates, kernel patches, and security fixes
    - cron: '0 2 * * 2'
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_baremetal_iso:
        description: 'Build Baremetal Installer ISO'
        type: boolean
        default: true
      build_vm_qcow2:
        description: 'Build Proxmox / KVM QCOW2 Image'
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-container:
    name: Build & Push bootc Container Image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=ref,event=tag

      - name: Build and push container image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Containerfile
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-disk-images:
    name: Build VM (QCOW2) & Baremetal (ISO)
    needs: build-container
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Free up disk space on Ubuntu runner (removes unnecessary preinstalled toolchains)
      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell
          df -h

      - name: Set up QEMU / KVM hardware acceleration
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-utils zstd
          # Test if KVM is available on runner
          ls -l /dev/kvm || true

      - name: Prepare build workspace and pull image into Podman storage
        run: |
          mkdir -p output/artifacts
          sudo mkdir -p /var/lib/containers/storage
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
          echo "==> Pulling target image into host container storage..."
          sudo podman pull "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

      # -------------------------------------------------------------
      # 1. Build Proxmox / KVM Virtual Machine Disk (QCOW2)
      # -------------------------------------------------------------
      - name: Build Proxmox / KVM QCOW2 Image
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_vm_qcow2 }}
        run: |
          echo "==> Generating QCOW2 image with bootc-image-builder..."
          mkdir -p output/qcow2_build
          sudo podman run \
            --rm \
            --privileged \
            --security-opt label=type:unconfined_t \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v "$(pwd)/output/qcow2_build":/output \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type qcow2 \
            --target-arch x86_64 \
            --local \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

          sudo chown -R "$(id -u):$(id -g)" output/qcow2_build

          echo "==> Compressing QCOW2 with zstd..."
          zstd -19 -T0 "$(pwd)/output/qcow2_build/qcow2/disk.qcow2" \
            -o "output/artifacts/azureclaw-proxmox-kvm-${{ github.sha }}.qcow2.zst"
          
          # Clean up uncompressed build directory to reclaim disk space
          sudo rm -rf output/qcow2_build

      # -------------------------------------------------------------
      # 2. Build Baremetal Installer ISO (Anaconda bootc installer)
      # -------------------------------------------------------------
      - name: Build Baremetal Installer ISO
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_baremetal_iso }}
        run: |
          echo "==> Generating Baremetal ISO installer with bootc-image-builder..."
          mkdir -p output/iso_build
          sudo podman run \
            --rm \
            --privileged \
            --security-opt label=type:unconfined_t \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v "$(pwd)/output/iso_build":/output \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type anaconda-iso \
            --target-arch x86_64 \
            --local \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

          sudo chown -R "$(id -u):$(id -g)" output/iso_build

          echo "==> Moving generated ISO to artifacts..."
          mv "$(pwd)/output/iso_build/bootiso/install.iso" \
            "output/artifacts/azureclaw-baremetal-installer-${{ github.sha }}.iso"
          
          sudo rm -rf output/iso_build

      # -------------------------------------------------------------
      # 3. Generate SHA256 Checksums
      # -------------------------------------------------------------
      - name: Generate Checksums
        run: |
          cd output/artifacts
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      # -------------------------------------------------------------
      # 4. Upload Build Artifacts to GitHub
      # -------------------------------------------------------------
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: azureclaw-build-${{ github.sha }}
          path: output/artifacts/*
          retention-days: 14

      # -------------------------------------------------------------
      # 5. Publish to GitHub Release on Version Tags
      # -------------------------------------------------------------
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output/artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
