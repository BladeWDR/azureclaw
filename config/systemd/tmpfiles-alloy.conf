# /usr/lib/tmpfiles.d/alloy.conf
# Ensure Alloy working, data, and configuration directories exist with correct permissions on fresh installs & boots
d /var/lib/alloy 0770 alloy alloy -
d /var/lib/alloy/data 0770 alloy alloy -
z /etc/alloy 0755 alloy alloy -
z /etc/alloy/config.alloy 0644 alloy alloy -
