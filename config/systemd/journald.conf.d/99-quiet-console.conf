# /usr/lib/systemd/journald.conf.d/99-quiet-console.conf
# Keep interactive physical console (tty1) clean of audit and background service logs.
# All audit and kernel events remain in the systemd journal (journalctl / Grafana Alloy).
[Journal]
ForwardToConsole=no
ForwardToWall=no
ReadKMsg=yes
Audit=yes
