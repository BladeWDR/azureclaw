#!/usr/sbin/nft -f
# /etc/sysctl.d or /etc/nftables/nftables.conf
# Azureclaw Stateful Firewall Ruleset

flush ruleset

# -------------------------------------------------------------
# Configuration Variables & Interface Definitions
# -------------------------------------------------------------
# WAN interfaces: supports eth0, ens18 (Proxmox VirtIO default), enp1s0
define WAN_IFACES = { "eth0", "ens18", "enp1s0" }

# LAN interfaces: supports eth1, ens19 (Proxmox VirtIO default), enp2s0
define LAN_IFACES = { "eth1", "ens19", "enp2s0" }

# VPN interfaces: WireGuard, Tailscale, OpenVPN (tun/tap), L2TP (ppp), and IPsec (ipsec/xfrm)
define VPN_IFACES = { "tailscale0", "wg*", "tun*", "tap*", "ppp*", "ipsec*", "xfrm*" }

# Management Ports allowed from LAN & VPN
define MGMT_PORTS = { 22, 9090, 12345 }  # SSH (22), Cockpit (9090), Grafana Alloy (12345)

# Router services offered to LAN
define LAN_SERVICES_UDP = { 53, 67 }      # DNS, DHCPv4
define LAN_SERVICES_TCP = { 53 }          # DNS

# -------------------------------------------------------------
# IPv4 / IPv6 Filter Table
# -------------------------------------------------------------
table inet router {

    # Traffic destined for this router host
    chain input {
        type filter hook input priority filter; policy drop;

        # 1. Loopback traffic
        iif "lo" accept

        # 2. Stateful inspection & TCP Flag anomaly defense
        ct state established,related accept
        ct state invalid drop

        # Drop port-scanning anomalies (Xmas, Null, invalid SYN combinations)
        tcp flags & (fin|syn|rst|psh|ack|urg) == fin|syn|rst|psh|ack|urg drop
        tcp flags & (fin|syn|rst|psh|ack|urg) == 0 drop
        tcp flags & (syn|fin) == syn|fin drop
        tcp flags & (syn|rst) == syn|rst drop

        # 3. ICMP / ICMPv6 handling (Path MTU discovery, TTL expiry, neighbor discovery)
        # Essential network signaling: allow PMTU & error messages, but restrict echo-request (ping)
        ip protocol icmp icmp type { destination-unreachable, time-exceeded } accept
        ip6 nexthdr icmpv6 icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem, nd-router-solicit, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept

        # Ping (echo-request) permitted ONLY from LAN and VPN interfaces (WAN ping dropped for full stealth)
        iifname { $LAN_IFACES, $VPN_IFACES } ip protocol icmp icmp type echo-request limit rate 50/second burst 100 packets accept
        iifname { $LAN_IFACES, $VPN_IFACES } ip6 nexthdr icmpv6 icmpv6 type echo-request limit rate 50/second burst 100 packets accept

        # 4. Services accepted ONLY from LAN
        iifname $LAN_IFACES udp dport $LAN_SERVICES_UDP accept
        iifname $LAN_IFACES tcp dport $LAN_SERVICES_TCP accept

        # 5. Management access (SSH, Cockpit, Alloy) from LAN & VPN interfaces
        iifname { $LAN_IFACES, $VPN_IFACES } tcp dport $MGMT_PORTS meter mgmt-limit { ip saddr limit rate 15/minute burst 5 packets } accept

        # 6. Inbound WAN Services (Full Stealth Posture)
        # All VPNs (Tailscale, WireGuard, OpenVPN, IPsec) operate as clients via stateful conntrack.
        # Uncomment below only if hosting explicit inbound VPN listeners on WAN:
        # udp dport 51820 accept  # WireGuard server
        # udp dport 41641 accept  # Tailscale direct peer-to-peer port

        # 7. Reject unhandled traffic politely on LAN, silently drop on WAN
        iifname $LAN_IFACES reject with icmpx type admin-prohibited
        # Implicit drop for everything else (WAN unsolicited packets)
    }

    # Routed traffic passing THROUGH this router
    chain forward {
        type filter hook forward priority filter; policy drop;

        # 1. Stateful inspection: accept established/related forwarding
        ct state established,related accept
        ct state invalid drop

        # 2. LAN to WAN: Allow all outbound internet traffic
        iifname $LAN_IFACES oifname $WAN_IFACES accept

        # 3. VPN / Tailscale routing (Subnet Router & Exit Node forwarding)
        iifname $VPN_IFACES oifname $LAN_IFACES accept
        iifname $VPN_IFACES oifname $WAN_IFACES accept
        iifname $LAN_IFACES oifname $VPN_IFACES accept

        # 4. Inter-VLAN / Port Forwarding rules (Add customized rules below)
        # Example for forwarding external port 8443 to internal server 192.168.1.100:443:
        # oifname $LAN_IFACES ip daddr 192.168.1.100 tcp dport 443 ct state new accept

        # Drop everything else
    }

    # Outbound host-generated traffic from the router itself
    chain output {
        type filter hook output priority filter; policy accept;
    }
}

# -------------------------------------------------------------
# IPv4 NAT Table
# -------------------------------------------------------------
table ip nat {
    chain prerouting {
        type nat hook prerouting priority dstnat; policy accept;

        # Port Forwarding (DNAT) examples:
        # iifname $WAN_IFACES tcp dport 8443 dnat to 192.168.1.100:443
    }

    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;

        # Outbound Masquerade: Rewrite internal IP to router WAN IP
        oifname $WAN_IFACES masquerade
    }
}
