# /etc/dnsmasq.d/30-dhcp.conf
# Azureclaw DHCP Scopes and Options (Managed by Cockpit)
# JSON_DHCP: {"lanScope":{"enabled":true,"rangeStart":"192.168.1.50","rangeEnd":"192.168.1.200","netmask":"255.255.255.0","leaseTime":"24h","gateway":"192.168.1.1","dns":"192.168.1.1","domain":"home.arpa"},"customOptions":[]}

# Primary LAN DHCP Scope
dhcp-range=192.168.1.50,192.168.1.200,255.255.255.0,24h
dhcp-option=option:router,192.168.1.1
dhcp-option=option:dns-server,192.168.1.1
dhcp-option=option:domain-name,home.arpa
