# /etc/dnsmasq.d/router.conf or /etc/dnsmasq.conf
# Azureclaw DHCP and DNS Caching Resolver

# -------------------------------------------------------------
# Interface & Binding Safety
# -------------------------------------------------------------
# Bind dynamically to avoid startup failures before interfaces are up
bind-dynamic

# Do NOT serve DHCP or respond to DNS queries on WAN interfaces
except-interface=eth0
except-interface=ens18
except-interface=enp1s0

# Listen on loopback and LAN interface
listen-address=127.0.0.1
listen-address=::1
listen-address=192.168.1.1

# -------------------------------------------------------------
# DNS Resolver Configuration
# -------------------------------------------------------------
# Never forward plain names (without a dot or domain part)
domain-needed

# Never forward addresses in non-routed address spaces
bogus-priv

# Anti-DNS Rebinding Protection:
# Drop upstream responses resolving to private/loopback IP ranges
stop-dns-rebind
rebind-localhost-ok

# Local DNS domain
domain=home.arpa
local=/home.arpa/
expand-hosts
address=/azureclaw.home.arpa/192.168.1.1
address=/azureclaw/192.168.1.1

# DNS Cache Size (default is 150)
cache-size=2500

# Upstream Public DNS Resolvers (Cloudflare & Quad9)
server=1.1.1.1#53
server=1.0.0.1#53
server=9.9.9.9#53
server=2606:4700:4700::1111
server=2620:fe::fe

# -------------------------------------------------------------
# DHCP Server Configuration (IPv4)
# -------------------------------------------------------------
# DHCP scopes and DHCP options are modularly configured in /etc/dnsmasq.d/30-dhcp.conf
# (Managed via Cockpit Router Settings Web UI or directly in /etc/dnsmasq.d/)
# Example:
# dhcp-range=192.168.1.50,192.168.1.200,255.255.255.0,24h
# dhcp-option=option:router,192.168.1.1
# dhcp-option=option:dns-server,192.168.1.1

# -------------------------------------------------------------
# Static DHCP Leases (Reservations) Examples
# -------------------------------------------------------------
# dhcp-host=aa:bb:cc:dd:ee:01,nas.home.arpa,192.168.1.10
# dhcp-host=aa:bb:cc:dd:ee:02,proxmox.home.arpa,192.168.1.2

# -------------------------------------------------------------
# Modular Configuration Snippets (/etc/dnsmasq.d/)
# -------------------------------------------------------------
# Automatically loads modular configuration files from /etc/dnsmasq.d/
# Perfect for adding VLAN pools, static leases, and custom overrides
# without modifying this base configuration file.
conf-dir=/etc/dnsmasq.d
