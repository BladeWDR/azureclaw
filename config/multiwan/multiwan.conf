# /etc/azureclaw/multiwan.conf
# Azureclaw Multi-WAN Active/Backup Failover Configuration
# After editing, run: sudo systemctl restart azureclaw-wan-failover

# Enable or disable Multi-WAN failover watchdog ("true" or "false")
MULTIWAN_ENABLED="false"

# Primary WAN interface and NetworkManager connection name
PRIMARY_WAN_IFACE="ens18"
PRIMARY_WAN_CON="WAN"

# Backup WAN interface and NetworkManager connection name
BACKUP_WAN_IFACE="ens20"
BACKUP_WAN_CON="WAN2"

# Canary IPv4 addresses to ping over PRIMARY_WAN_IFACE to verify ISP upstream health
CHECK_TARGETS="1.1.1.1 9.9.9.9"

# Seconds between health checks
CHECK_INTERVAL="15"

# Consecutive failed checks before failing over to BACKUP_WAN_IFACE
FAIL_THRESHOLD="3"

# Consecutive successful checks before failing back to PRIMARY_WAN_IFACE
RECOVERY_THRESHOLD="3"

# Route metrics (lower metric = higher priority default route)
PRIMARY_METRIC="100"
BACKUP_METRIC="200"
DEMOTED_METRIC="500"
