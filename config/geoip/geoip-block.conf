# /etc/azureclaw/geoip-block.conf
# Azureclaw MaxMind GeoIP Firewall Configuration
# After editing, run: sudo /usr/libexec/azureclaw/update-geoip.sh

# Enable or disable GeoIP filtering ("true" or "false")
GEOIP_ENABLED="false"

# Filtering mode:
#   "block" - Drop traffic matching GEOIP_COUNTRIES (denylist mode)
#   "allow" - Allow ONLY traffic matching GEOIP_COUNTRIES and drop all other countries (allowlist mode)
GEOIP_MODE="block"

# Space- or comma-separated list of ISO 3166-1 alpha-2 country codes (e.g. "CN RU KP IR")
GEOIP_COUNTRIES=""

# Traffic direction to filter on WAN interfaces:
#   "inbound"  - Filter unsolicited inbound WAN traffic (e.g. before Port Forwards / DNAT or VPN listeners)
#   "outbound" - Filter outbound LAN/VLAN -> WAN internet egress
#   "both"     - Filter both inbound and outbound WAN traffic
GEOIP_DIRECTION="both"

# Path to MaxMind GeoLite2 Country database downloaded by geoipupdate
GEOIP_MMDB_PATH="/var/lib/GeoIP/GeoLite2-Country.mmdb"
