# /etc/GeoIP.conf
# Configuration file for MaxMind geoipupdate
# Obtain a free GeoLite2 Account ID and License Key at:
# https://www.maxmind.com/en/geolite2/signup

AccountID YOUR_ACCOUNT_ID_HERE
LicenseKey YOUR_LICENSE_KEY_HERE

# Download the GeoLite2-Country binary database (.mmdb)
EditionIDs GeoLite2-Country

# Store databases in /var/lib/GeoIP (persistent across immutable bootc upgrades)
DatabaseDirectory /var/lib/GeoIP
