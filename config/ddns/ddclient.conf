# /etc/ddclient.conf
# Azureclaw Dynamic DNS (DDNS) Configuration (ddclient v4.0+)
# Permissions MUST remain 0600 (ddclient:ddclient)
# After editing, run: sudo systemctl restart ddclient

# Check IP every 5 minutes (configured via /etc/sysconfig/ddclient)
syslog=yes
ssl=yes

# Method to discover external WAN IPv4 address:
# Option A: External HTTPS IP echo service (works even behind ISP double-NAT)
usev4=webv4, webv4=https://checkip.amazonaws.com/
# Option B: Read directly from the router WAN interface
# usev4=ifv4, ifv4=ens18

# -----------------------------------------------------------------------------
# Provider Examples (Uncomment and fill in ONE block below to activate DDNS)
# -----------------------------------------------------------------------------

# 1. Cloudflare (API Token with Zone:DNS:Edit permission)
# protocol=cloudflare, \
# zone=example.com, \
# ttl=1, \
# login=token, \
# password=YOUR_CLOUDFLARE_API_TOKEN \
# router.example.com

# 2. DuckDNS
# protocol=duckdns, \
# password=YOUR_DUCKDNS_TOKEN \
# yoursubdomain.duckdns.org

# 3. Namecheap
# protocol=namecheap, \
# server=dynamicdns.park-your-domain.com, \
# login=example.com, \
# password=YOUR_NAMECHEAP_DDNS_PASSWORD \
# router

# 4. No-IP / DynDNS2 Compatible
# protocol=dyndns2, \
# server=dynupdate.no-ip.com, \
# login=YOUR_USERNAME, \
# password=YOUR_PASSWORD \
# yourhost.ddns.net

# 5. Porkbun
# protocol=porkbun, \
# apikey=pk1_YOUR_API_KEY, \
# secretapikey=sk1_YOUR_SECRET_KEY \
# router.example.com
