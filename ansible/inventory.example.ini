# Ansible Inventory Example for Azureclaw
# Copy to inventory.ini and edit before running:
# ansible-playbook -i inventory.ini playbook.yml

[routers]
azureclaw-primary ansible_host=192.168.1.1 ansible_user=admin

[routers:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'
