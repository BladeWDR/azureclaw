---
- name: Configure Azureclaw Immutable Router
  hosts: routers
  become: true
  vars_files:
    - vars/main.yml

  tasks:
    - name: Ensure .ssh directory exists for admin
      file:
        path: /home/admin/.ssh
        state: directory
        owner: admin
        group: admin
        mode: '0700'

    - name: Configure authorized keys for admin user
      authorized_key:
        user: admin
        key: "{{ item }}"
        state: present
      loop: "{{ admin_authorized_keys }}"
      when: admin_authorized_keys | length > 0

    - name: Configure custom dnsmasq configuration (DHCP & Static Leases)
      copy:
        dest: /etc/dnsmasq.d/99-ansible-custom.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          # Managed by Ansible - Do not edit manually
          domain={{ domain_name }}
          local=/{{ domain_name }}/
          dhcp-range={{ dhcp_range_start }},{{ dhcp_range_end }},{{ lan_netmask }},{{ dhcp_lease_time }}
          dhcp-option=option:router,{{ lan_ip }}
          dhcp-option=option:dns-server,{{ lan_ip }}

          {% for dns in upstream_dns_servers %}
          server={{ dns }}
          {% endfor %}

          {% for lease in dhcp_static_leases %}
          dhcp-host={{ lease.mac }},{{ lease.name }}.{{ domain_name }},{{ lease.ip }}
          {% endfor %}
      notify: Restart dnsmasq

    - name: Configure custom nftables port forwards
      copy:
        dest: /etc/nftables/99-port-forwards.nft
        owner: root
        group: root
        mode: '0644'
        content: |
          # Managed by Ansible - Port forwards
          {% if port_forwards | length > 0 %}
          table ip nat {
              chain prerouting {
                  {% for fwd in port_forwards %}
                  iifname "{{ wan_interface_name }}" {{ fwd.protocol }} dport {{ fwd.wan_port }} dnat to {{ fwd.target_ip }}:{{ fwd.target_port }}
                  {% endfor %}
              }
          }
          table inet router {
              chain forward {
                  {% for fwd in port_forwards %}
                  ip daddr {{ fwd.target_ip }} {{ fwd.protocol }} dport {{ fwd.target_port }} ct state new accept
                  {% endfor %}
              }
          }
          {% endif %}
      notify: Reload nftables

    - name: Configure Grafana Alloy telemetry endpoints
      copy:
        dest: /etc/sysconfig/alloy
        owner: root
        group: root
        mode: '0644'
        content: |
          # Managed by Ansible - Grafana Alloy Telemetry
          CUSTOM_ARGS="--server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data"
          PROMETHEUS_REMOTE_WRITE_URL="{{ alloy_prometheus_remote_write_url }}"
          LOKI_PUSH_URL="{{ alloy_loki_push_url }}"
          PROMETHEUS_USERNAME="{{ alloy_prometheus_username }}"
          PROMETHEUS_PASSWORD="{{ alloy_prometheus_password }}"
          LOKI_USERNAME="{{ alloy_loki_username }}"
          LOKI_PASSWORD="{{ alloy_loki_password }}"
      notify: Restart alloy

    - name: Configure MaxMind GeoIP credentials
      copy:
        dest: /etc/GeoIP.conf
        owner: root
        group: root
        mode: '0600'
        content: |
          # Managed by Ansible - MaxMind geoipupdate configuration
          AccountID {{ geoip_account_id }}
          LicenseKey {{ geoip_license_key }}
          EditionIDs GeoLite2-Country
          DatabaseDirectory /var/lib/GeoIP
      notify: Update GeoIP ruleset

    - name: Ensure /etc/azureclaw directory exists
      file:
        path: /etc/azureclaw
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Configure Azureclaw GeoIP firewall blocking rules
      copy:
        dest: /etc/azureclaw/geoip-block.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          # Managed by Ansible - MaxMind GeoIP Firewall Configuration
          GEOIP_ENABLED="{{ 'true' if geoip_enabled else 'false' }}"
          GEOIP_MODE="{{ geoip_mode }}"
          GEOIP_COUNTRIES="{{ geoip_countries }}"
          GEOIP_DIRECTION="{{ geoip_direction }}"
          GEOIP_MMDB_PATH="/var/lib/GeoIP/GeoLite2-Country.mmdb"
      notify: Update GeoIP ruleset

    - name: Configure Dynamic DNS client (ddclient)
      copy:
        dest: /etc/ddclient.conf
        owner: ddclient
        group: ddclient
        mode: '0600'
        content: |
          # Managed by Ansible - ddclient configuration
          syslog=yes
          ssl=yes
          usev4={{ ddns_usev4 }}
          protocol={{ ddns_protocol }}, \
          {% if ddns_server | length > 0 %}
          server={{ ddns_server }}, \
          {% endif %}
          {% if ddns_zone | length > 0 %}
          zone={{ ddns_zone }}, \
          {% endif %}
          {% if ddns_login | length > 0 %}
          login={{ ddns_login }}, \
          {% endif %}
          password={{ ddns_password }} \
          {{ ddns_hostname }}
      when: ddns_enabled | bool and ddns_hostname | length > 0
      notify: Restart ddclient

    - name: Configure NUT mode (netclient)
      copy:
        dest: /etc/ups/nut.conf
        owner: root
        group: nut
        mode: '0640'
        content: |
          # Managed by Ansible - NUT configuration
          MODE=netclient
      when: nut_enabled | bool
      notify: Restart nut-monitor

    - name: Configure NUT UPS monitor (upsmon.conf)
      copy:
        dest: /etc/ups/upsmon.conf
        owner: root
        group: nut
        mode: '0640'
        content: |
          # Managed by Ansible - NUT upsmon configuration
          MONITOR {{ nut_ups_identifier }} 1 {{ nut_ups_user }} {{ nut_ups_password }} {{ nut_ups_role }}
          MINSUPPLIES 1
          SHUTDOWNCMD "/sbin/shutdown -h +0"
          POLLFREQ 5
          POLLFREQALERT 5
          HOSTSYNC 15
          DEADTIME 15
          POWERDOWNFLAG /etc/killpower
          RBWARNTIME 43200
          NOCOMMWARNTIME 300
          FINALDELAY 5
      when: nut_enabled | bool and nut_ups_password | length > 0
      notify: Restart nut-monitor

    - name: Check bootc image deployment status
      command: bootc status
      register: bootc_status_out
      changed_when: false

    - name: Display current bootc deployment
      debug:
        msg: "{{ bootc_status_out.stdout_lines }}"

  handlers:
    - name: Restart dnsmasq
      systemd:
        name: dnsmasq
        state: restarted

    - name: Reload nftables
      systemd:
        name: nftables
        state: reloaded

    - name: Restart alloy
      systemd:
        name: alloy
        state: restarted

    - name: Update GeoIP ruleset
      command: /usr/libexec/azureclaw/update-geoip.sh

    - name: Restart ddclient
      systemd:
        name: ddclient
        state: restarted
        enabled: true

    - name: Restart nut-monitor
      systemd:
        name: nut-monitor
        state: restarted
        enabled: true
